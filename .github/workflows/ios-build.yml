name: Switch iOS Build

on:
  push:
    branches: [ main, master, devin/1779208175-add-swift-files ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'

      - name: Build Archive
        run: |
          xcodebuild -project Switch.xcodeproj \
            -scheme Switch \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath build/Switch.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export IPA (Unsigned)
        run: |
          mkdir -p build/Payload
          cp -r build/Switch.xcarchive/Products/Applications/Switch.app build/Payload/
          cd build
          zip -r Switch.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Unsigned-IPA
          path: build/Switch.ipa
          retention-days: 7
