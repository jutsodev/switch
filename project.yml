name: Switch
options:
  bundleIdPrefix: com.jutsodev
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  Switch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SwitchApp
    resources:
      - path: Sources/SwitchApp/Assets.xcassets
    info:
      path: SwitchInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jutsodev.switch
        PRODUCT_NAME: Switch
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
